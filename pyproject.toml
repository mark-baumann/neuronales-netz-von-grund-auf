[project]
name = "neuronales-netz-von-grund-auf"
version = "0.1.0"
description = "Neuronales Netz von Grund auf — nur mit NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PERF"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
